[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-snooker"
version = "0.1.2.dev0"
description = "Terminal monitor for Linux routers: live per-host traffic and scheduled service blocking"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Adam Waldenberg, Adeptum AB", email = "info@adeptum.se" }]
requires-python = ">=3.11"
dependencies = ["textual"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
network-snooker = "network_snooker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_snooker = ["services.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
